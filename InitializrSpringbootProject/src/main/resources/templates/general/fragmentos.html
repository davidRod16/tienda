<!-- Fragmento: head (cabecera HTML con estilos) -->
<head th:fragment="head">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Tienda - Gestión de Categorías</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    
    <!-- Estilos personalizados -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}"/>
</head>

<!-- Fragmento: header (encabezado con navegación) -->
<header th:fragment="header" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">
            <i class="fa-solid fa-store"></i> Tienda
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/categoria/listado}">Categorías</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/ejemplo2}">Ejemplo 2</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/multimedia}">Multimedia</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/iframes}">Iframes</a>
                </li>
            </ul>
        </div>
    </div>
</header>

<!-- Fragmento: footer (pie de página) -->
<footer th:fragment="footer" class="bg-dark text-white text-center py-4 mt-5">
    <div class="container">
        <p class="mb-0">&copy; 2024 Tienda del Curso. Todos los derechos reservados.</p>
        <p class="text-muted mb-0">Universidad Fidélitas - Desarrollo Web con Spring Boot</p>
    </div>
</footer>

<!-- Scripts de Bootstrap y jQuery (necesarios para modales y interactividad) -->
<script th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</script>
